<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaboHack - Inscription</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Navigation -->
    <nav>
      <a href="#">ACCUEIL</a>
      <a href="#">À PROPOS</a>
      <a href="#">FONCTIONNALITÉS</a>
      <a href="#">TARIFS</a>
      <a href="#">CONTACT</a>
    </nav>

    <!-- Formulaire -->
    <h1>CRÉER UN COMPTE</h1>

    <form id="signupForm">
      <div class="field">
        <label>NOM D'UTILISATEUR</label>
        <input type="text" id="username" placeholder="Choisis un nom d'utilisateur" required />
      </div>

      <div class="field">
        <label>EMAIL</label>
        <input type="email" id="email" placeholder="exemple@email.com" required />
      </div>

      <div class="field">
        <label>MOT DE PASSE</label>
        <input type="password" id="password" placeholder="••••••••" required />
        <div style="margin-top:0.3rem; display:flex; gap:1rem; align-items:center;">
          <span id="strengthLabel" style="color:#666;font-size:0.7rem;">Force : —</span>
          <div style="display:flex; gap:0.3rem;">
            <span id="strengthBar1" class="strength-bar"></span>
            <span id="strengthBar2" class="strength-bar"></span>
            <span id="strengthBar3" class="strength-bar"></span>
          </div>
        </div>
        <span style="color:#666;font-size:0.6rem;">Minimum 8 caractères</span>
      </div>

      <div class="field">
        <label>CONFIRMER LE MOT DE PASSE</label>
        <input type="password" id="confirmPassword" placeholder="Confirme ton mot de passe" required />
      </div>

      <div class="field">
        <label>PAYS</label>
        <select id="country" required>
          <option value="">Sélectionne ton pays</option>
          <option value="France">France</option>
          <option value="Belgique">Belgique</option>
          <option value="Suisse">Suisse</option>
          <option value="Canada">Canada</option>
          <option value="Sénégal">Sénégal</option>
          <option value="Côte d'Ivoire">Côte d'Ivoire</option>
          <option value="Madagascar">Madagascar</option>
          <option value="Autre">Autre</option>
        </select>
      </div>

      <div class="field">
        <label>SEXE</label>
        <div style="display:flex; gap:1.5rem; margin-top:0.3rem;">
          <label><input type="radio" name="gender" value="Homme" required /> Homme</label>
          <label><input type="radio" name="gender" value="Femme" /> Femme</label>
          <label><input type="radio" name="gender" value="Autre" /> Autre</label>
        </div>
      </div>

      <div class="field">
        <label>COMPTE FACEBOOK OU ADRESSE E-MAIL</label>
        <input type="text" id="social" placeholder="Ton nom d'utilisateur Facebook ou email" />
      </div>

      <div class="field" style="margin:1rem 0;">
        <label style="display:inline;">
          <input type="checkbox" id="terms" required />
          J'accepte les conditions d'utilisation
        </label>
      </div>

      <button type="submit">S'INSCRIRE</button>
      <div style="text-align:center; margin:0.5rem 0; color:#666;">OU</div>
      <button type="button" id="githubBtn" style="background:#333; color:#fff; box-shadow:none;">S'INSCRIRE AVEC GITHUB</button>
      <p style="text-align:center; color:#00f0ff; margin-top:1rem;">
        Déjà un compte ? <a href="#" style="color:#00ff41; text-decoration:none;">Se connecter</a>
      </p>
    </form>

    <div id="toast" class="toast hidden">✅ Données envoyées !</div>
  </div>

  <footer>
    <p>FAIT AVEC PASSION PAR NYAVO</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
