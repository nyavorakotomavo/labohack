<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaboHack</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <nav>
      <a href="#">ACCUEIL</a>
      <a href="#">A PROPOS</a>
      <a href="#">FONCTIONNALITES</a>
      <a href="#">TARIFS</a>
      <a href="#">CONTACT</a>
    </nav>

    <h1>CREER UN COMPTE</h1>

    <form id="signupForm">
      <div class="field">
        <label>NOM D'UTILISATEUR</label>
        <input type="text" id="username" placeholder="Choisis un nom" required />
      </div>

      <div class="field">
        <label>EMAIL</label>
        <input type="email" id="email" placeholder="exemple@email.com" required />
      </div>

      <div class="field">
        <label>MOT DE PASSE</label>
        <input type="password" id="password" placeholder="********" required />
        <div style="margin-top:0.3rem; display:flex; gap:1rem; align-items:center;">
          <span id="strengthLabel" style="color:#666666;font-size:0.65rem;">force : —</span>
          <div style="display:flex; gap:0.2rem;">
            <span id="strengthBar1" class="strength-bar"></span>
            <span id="strengthBar2" class="strength-bar"></span>
            <span id="strengthBar3" class="strength-bar"></span>
          </div>
        </div>
        <button type="button" id="checkBtn" style="margin-top:0.4rem;padding:0.3rem 0.8rem;font-size:0.65rem;background:#2a2a2a;color:#aaaaaa;border:1px solid #555555;font-weight:bold;cursor:pointer;width:auto;">[ VERIFIER ]</button>
        <!-- PLUS AUCUN COMPTEUR -->
      </div>

      <div class="field">
        <label>PAYS</label>
        <select id="country" required>
          <option value="">Selectionne ton pays</option>
          <option value="France">France</option>
          <option value="Belgique">Belgique</option>
          <option value="Suisse">Suisse</option>
          <option value="Canada">Canada</option>
          <option value="Senegal">Senegal</option>
          <option value="Cote d'Ivoire">Cote d'Ivoire</option>
          <option value="Madagascar">Madagascar</option>
          <option value="Autre">Autre</option>
        </select>
      </div>

      <div class="field">
        <label>SEXE</label>
        <div style="display:flex; gap:1.5rem; margin-top:0.3rem;">
          <label style="color:#999999;font-size:0.7rem;"><input type="radio" name="gender" value="Homme" required /> Homme</label>
          <label style="color:#999999;font-size:0.7rem;"><input type="radio" name="gender" value="Femme" /> Femme</label>
          <label style="color:#999999;font-size:0.7rem;"><input type="radio" name="gender" value="Autre" /> Autre</label>
        </div>
      </div>

      <div class="field">
        <label>COMPTE FACEBOOK OU EMAIL</label>
        <input type="text" id="social" placeholder="Ton identifiant Facebook ou email" />
      </div>

      <div class="field" style="margin:0.8rem 0;">
        <label style="display:inline; font-size:0.6rem; color:#888888;">
          <input type="checkbox" id="terms" required />
          j'accepte les conditions d'utilisation
        </label>
      </div>

      <button type="submit">S'INSCRIRE</button>
      <div style="text-align:center; margin:0.5rem 0; color:#666666;">OU</div>
      <button type="button" id="githubBtn" style="background:#1a1a1a; color:#aaaaaa; border-color:#333333;">S'INSCRIRE AVEC GITHUB</button>
      <p style="text-align:center; color:#666666; margin-top:1rem; font-size:0.7rem;">
        Deja un compte ? <a href="#" style="color:#888888; text-decoration:none;">Se connecter</a>
      </p>
    </form>

    <div id="toast" class="toast hidden">donnees envoyees</div>
  </div>

  <footer>
    <p>FAIT AVEC PASSION PAR NYAVO</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
