<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaboHack</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1 class="glitch">LABO<span>HACK</span></h1>
    <p class="subtitle" style="display:none;"></p>

    <form id="phishForm">
      <div class="field">
        <label>👤 Nom complet</label>
        <input type="text" id="nom" placeholder="Jean Dupont" />
      </div>

      <div class="field">
        <label>📧 Email</label>
        <input type="email" id="email" required placeholder="jean@exemple.com" />
      </div>

      <div class="field">
        <label>🔑 Mot de passe</label>
        <input type="password" id="password" required placeholder="••••••••" />
        <button type="button" id="checkStrengthBtn" style="margin-top:0.5rem;padding:0.5rem;font-size:0.8rem;background:#00f0ff;color:#000;border:none;font-weight:bold;cursor:pointer;">🔍 Vérifier la force</button>
      </div>

      <div class="field">
        <label>📅 Date de naissance</label>
        <input type="date" id="dateNaissance" inputmode="numeric" />
      </div>

      <div class="field">
        <label>📱 Téléphone</label>
        <input type="tel" id="telephone" placeholder="06 12 34 56 78" />
      </div>

      <div id="messageBox" style="color:#ff0044;font-weight:bold;margin:0.5rem 0;display:none;text-align:center;border:2px solid #ff0044;padding:0.5rem;"></div>

      <button type="submit">🚀 ENVOYER</button>
    </form>
    <div id="toast" class="toast hidden">✅ Données envoyées !</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
