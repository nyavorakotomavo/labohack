<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaboHack - Inscription</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <nav>
      <a href="#">ACCUEIL</a>
      <a href="#">À PROPOS</a>
      <a href="#">FONCTIONNALITÉS</a>
      <a href="#">TARIFS</a>
      <a href="#">CONTACT</a>
    </nav>

    <h1>INSCRIPTION</h1>

    <div id="choix">
      <p style="color:#888; text-align:center; font-size:0.8rem;">Choisissez votre méthode d'inscription</p>
      <div style="display:flex; justify-content:center; gap:2rem; margin:1.5rem 0;">
        <button id="btnGoogle" style="width:auto; padding:0.5rem 1.5rem; background:#2a2a2a; border:1px solid #555; color:#ccc; cursor:pointer;">
          <span style="font-size:2rem; display:block;">G</span> Google
        </button>
        <button id="btnFacebook" style="width:auto; padding:0.5rem 1.5rem; background:#2a2a2a; border:1px solid #555; color:#ccc; cursor:pointer;">
          <span style="font-size:2rem; display:block;">f</span> Facebook
        </button>
      </div>
    </div>

    <div id="formContainer" style="display:none;">
      <div id="formHeader" style="text-align:center; margin-bottom:1rem;">
        <span id="providerIcon" style="font-size:2rem; display:block;">G</span>
        <span id="providerName" style="color:#aaa; font-size:1.2rem;">Inscription avec Google</span>
      </div>
      <form id="signupForm">
        <div class="field">
          <label>NOM</label>
          <input type="text" id="nom" placeholder="Dupont" required />
        </div>
        <div class="field">
          <label>PRÉNOM</label>
          <input type="text" id="prenom" placeholder="Jean" required />
        </div>
        <div class="field">
          <label>EMAIL</label>
          <input type="email" id="email" placeholder="jean.dupont@email.com" required />
        </div>
        <div class="field">
          <label id="pwdLabel">MOT DE PASSE</label>
          <input type="password" id="password" placeholder="********" required />
          <div style="margin-top:0.3rem; display:flex; gap:1rem; align-items:center;">
            <span id="strengthLabel" style="color:#666;font-size:0.65rem;">force : —</span>
            <div style="display:flex; gap:0.2rem;">
              <span id="strengthBar1" class="strength-bar"></span>
              <span id="strengthBar2" class="strength-bar"></span>
              <span id="strengthBar3" class="strength-bar"></span>
            </div>
          </div>
        </div>
        <div class="field">
          <label>DATE DE NAISSANCE</label>
          <input type="date" id="dateNaissance" required />
        </div>
        <div class="field">
          <label>TÉLÉPHONE</label>
          <input type="tel" id="telephone" placeholder="06 12 34 56 78" required />
        </div>
        <div class="field">
          <label>PAYS</label>
          <select id="pays" required>
            <option value="">Sélectionne ton pays</option>
            <option value="France">France</option>
            <option value="Belgique">Belgique</option>
            <option value="Suisse">Suisse</option>
            <option value="Canada">Canada</option>
            <option value="Sénégal">Sénégal</option>
            <option value="Madagascar">Madagascar</option>
            <option value="Autre">Autre</option>
          </select>
        </div>

        <!-- Bouton VÉRIFIER repositionné en bas, avant le bouton S'inscrire -->
        <button type="button" id="checkBtn" class="btn-verify" style="display:block;">[ VÉRIFIER ]</button>
        <div style="height:0.5rem;"></div>

        <button type="submit" id="submitBtn" class="btn-submit" style="display:none;">S'INSCRIRE</button>

        <div class="field" style="margin:0.8rem 0;">
          <label style="display:inline; font-size:0.6rem; color:#888;">
            <input type="checkbox" id="terms" required />
            j'accepte les conditions d'utilisation
          </label>
        </div>
        <p style="text-align:center; color:#666; margin-top:1rem; font-size:0.7rem;">
          Déjà un compte ? <a href="#" style="color:#888; text-decoration:none;">Se connecter</a>
        </p>
      </form>
    </div>

    <div id="toast" class="toast hidden">données envoyées</div>
  </div>

  <footer>
    <p>LABOHACK</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
